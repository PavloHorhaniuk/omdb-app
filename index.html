<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMDb + User Cards</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <form class="search-form" id="search-form" autocomplete="off">
    <input type="text" name="query" placeholder="Пошук фільмів (OMDb)..." />
    <select name="type">
      <option value="">All</option>
      <option value="movie">Movie</option>
      <option value="series">Series</option>
      <option value="episode">Episode</option>
    </select>
    <input type="text" name="year" placeholder="Year" />
    <button type="submit">Search</button>
  </form>

  <div class="controls">
    <button id="add-card-btn" class="btn btn-primary">+ Додати картку</button>
    <button id="my-cards-btn" class="btn">Мої картки</button>
    <button id="public-cards-btn" class="btn">Публічні картки</button>
  </div>

  <ul class="gallery"></ul>

  <div class="controls">
    <button id="load-more" class="btn" style="display:none">Load more</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
